  - Exploding Kittens
  hype: Trees? Overrated. This paper single-handedly proves that BELIEFS are what matter, a finding with profound implications for game AI, philosophy, and possibly religion. 53% better at predicting explosions. Bomb squads are reportedly taking notes.
- file: paper2.pdf
  title: 'Wrapping Around: Translation-Equivariant Deep Q-Learning for Toroidal Battleship'
  authors:
  - name: Theodora Kessling
    affiliations:
    - 1
  affiliations:
  - School of Computing and Interactive Systems, Aldenmoor University
  abstract: 'Battleship is a compact benchmark for sequential search under uncertainty: a shooter must locate a hidden fleet using only hit, miss, and sunk feedback. We study a variant played on a torus, where the board wraps around at every edge and ships may cross the border. This removes the edges and corners that classic Battleship strategies exploit and makes the game exactly symmetric under the group Z_N × Z_N of board translations. We show that this symmetry can be built directly into a deep Q-network: a fully convolutional network with circular padding and no positional input is exactly translation-equivariant, needs no data augmentation, and can be applied unchanged to boards of any size. Trained with Double DQN on 5.1 million transitions in under ten minutes on a single GPU, the resulting agent clears a 10 × 10 toroidal board in 46.74 ± 0.28 shots on average, compared with 51.81 ± 0.27 for a hunt/target heuristic with parity that we adapted to the torus. On the same 1000 boards
    it needs 5.06 ± 0.39 fewer shots (z ≈ 12.8), and it wins 66.6% (333 of 500) of head-to-head games against the heuristic. A phase decomposition shows that the gain comes mostly from the hunting phase, before any ship has been hit. We also release a toroidal Battleship testbed with a clean agent interface and evaluation harness.'
  tags:
  - Deep Q-Learning
  - Symmetry
  - Battleship
  hype: What if the ocean had no edges? This paper dares to ask the question Magellan was too scared to. Battleship, but on a DONUT. Trained in under ten minutes, which is less time than it takes a human to find the last submarine.
- file: paper3.pdf
  title: 'Learning to Play the Field: What a Deep Q-Network Does and Does Not Learn in Round-Robin Iterated Prisoner’s Dilemma'
  authors:
  - name: Kwame Asante-Boateng
    affiliations:
    - 1
  - name: Yuki Hayashida
    affiliations:
    - 2
  - name: Léa Fournier-Dubois
    affiliations:
    - 1
  affiliations:
  - School of Computing, Calderbrook University, Toronto, Ontario, Canada
  - Graduate School of Informatics, Shirakawa Institute of Science and Technology, Sendai, Japan
  abstract: 'In a round-robin Iterated Prisoner’s Dilemma tournament an agent does not face an opponent, it faces a field: a single policy must infer who it is playing from the history of the current match and best-respond, without ever being told the opponent’s identity. We train a double deep Q-network for this setting over a 21-feature abstraction of the match history whose central ingredient is the opponent’s cooperation rate conditional on our own previous move, and we evaluate it with a protocol borrowed from supervised learning rather than from the tournament literature: opponents are split into a training pool and a held-out set that never influences training or model selection, behavioural probes measure how an agent plays rather than how much it scores, and every number is reported over five independently trained networks. The protocol changes the conclusion. On aggregate tournament score the learned agent places a respectable fourth of twelve and beats the random baseline by +0.617
    points per round (p ≈ 10⁻²³); the held-out split shows that this hides a collapse in generalisation (2.70 against training opponents versus 2.09 against held-out ones, while a hand-written heuristic scores 2.70 and 2.99), and the probes localise the collapse to a single behaviour — escaping a mutual-defection spiral, where the network scores 0.14 against the heuristic’s 0.99. A per-seed analysis further shows that the large variance of the learned agent is not noise but two distinct strategy basins that the random seed alone decides between. We argue that held-out opponents, probe suites and multi-seed reporting should be the default protocol for learned agents in repeated games.'
  tags:
  - Deep Q-Learning
  - Prisoner's Dilemma
  hype: Forty-five years after Axelrod, someone finally asked the network what it actually learned. The answer will shock you (it cannot escape a mutual-defection spiral, much like the reviewers of this conference). p ≈ 10⁻²³. That is not a typo. That is SCIENCE.
- file: paper4.pdf
  title: Learning to Play Battleship with Tabular Q-Learning over a Local Cell Abstraction
  authors:
  - name: Priya Raghunathan
    affiliations:
    - 1
  - name: Mateo Villalobos Ríos
    affiliations:
