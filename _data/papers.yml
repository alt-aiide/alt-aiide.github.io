- file: paper6.pdf
  title: 'Reading the Table: Planning with Plan Recognition in Azul'
  authors:
  - name: Tobias Renner
    affiliations:
    - 1
  affiliations:
  - Institute for Games and Interactive Systems, Westmarch University
  abstract: 'Azul is a tile-drafting board game in which every tile, every pattern line and every wall is face up: the state is perfectly observable, and the only hidden thing is what the opponent intends. We show that this makes Azul an unusually clean testbed for plan recognition, provided one picks the right unit of intention. We define a plan as a commitment of pattern lines to colours and value a plan by projecting it onto the wall, so that adjacency and the row, column and colour bonuses are credited to the combination of commitments rather than to individual tiles. The abstraction is small enough to search exhaustively in principle and by a width-12 beam in practice (which recovers the exhaustive optimum on 98.3% of sampled boards), and concrete enough to be recognised from an opponent’s public board: we maintain a Boltzmann-rational posterior over the opponent’s commitments, updated by differencing their board between our own turns, and read it out as “what the opponent is waiting
    for”. Tile denial then falls out of evaluating the position from both sides rather than being a bolted-on special case. A controlled ablation over 5,700 games separates two design decisions that are usually conflated. Modelling the opponent at all is worth 19.5 points of win rate against our heuristic baseline (50.4% → 69.9%, p < 10⁻¹¹); recognising which plan they are pursuing adds a further increment that is small but reliable (55.9% ± 2.4 over 1,600 paired head-to-head games, p < 10⁻⁵). Intrinsically, the recogniser names the opponent’s next (line, colour) commitment 1.8–2.5 times as often as chance, and — the right sanity check — collapses to chance against a random opponent, who has no plan to find. To our knowledge this is the first published application of plan recognition to a tile-placement board game.'
  tags:
  - Plan Recognition
  - Ablation
  - Azul
  - Board Games
  hype: The first application of plan recognition to a tile-placement board game. EVER. In the HISTORY OF PUBLISHED SCIENCE. It reads your mind from your pattern lines. Never play Azul against it with anyone you love.
- file: paper7.pdf
  title: Does Knowing Your Opponent Help? Planning and Plan Recognition in Four-Player Backgammon
  authors:
  - name: Elena Marwick
    affiliations:
    - 1
  affiliations:
  - Department of Computer Science, Northvale Institute of Technology
  abstract: 'Backgammon has served as an AI benchmark for decades, but almost exclusively in its two-player form. With more than two players the game stops being a zero-sum contest between two sides, and modelling individual opponents becomes potentially more valuable. We introduce a free-for-all four-player backgammon variant that stays as close as possible to the standard rules, and release it as an open-source testbed. On top of it we build an agent that combines selective expectimax lookahead with Bayesian plan recognition: each opponent is modelled as a Boltzmann-rational follower of one hidden plan from a library of five playing styles plus a random plan, and the posterior over plans is used to predict that opponent’s replies inside the search. Lookahead significantly improves on the greedy evaluation it is built on. Plan recognition is accurate (81.9% top-1 accuracy against 16.7% chance, 69% after only ten observed decisions), yet across four experiments it produces no statistically
    significant change in playing strength. Decision logging shows why: recognition changes only 2.8–5.6% of the planner’s moves, and a planner that is told each opponent’s true plan does no better. In our setting the bottleneck is how much the planner can exploit an opponent model, not how accurate that model is. We argue that this is a general lesson for opponent modelling in multi-player stochastic games.'
  tags:
  - Expectimax
  - Plan Recognition
  - Opponent Modelling
  - Backgammon
  hype: Backgammon, but with FOUR PLAYERS. Twice the players, twice the dice, infinitely more chaos. Featuring a bold negative result so honest that several reviewers had to lie down.
