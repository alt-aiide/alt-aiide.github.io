  - Departamento de Ciencias de la Computación, Universidad de Sierra Clara, Guadalajara, México
  abstract: 'Game-playing agents are usually reported as a bundle: a paper states a final playing strength without saying which part of the machinery paid for it. We present a controlled attribution study for English draughts (American checkers) built on a single design decision — a one-ply baseline and a full iterative-deepening alpha–beta agent read the same static evaluation object, so a match between them measures the tree search and nothing else. Under that constraint the search scores 0.933 ± 0.062 per game against its own evaluation applied at one ply. We then ablate each classical enhancement along two axes that we argue should always be reported separately: a node ablation at fixed depth, which provably cannot change the move and can therefore be validated by an agreement check, and an equal-time ablation, in which saved nodes become extra depth and therefore won games. Alpha–beta with move ordering searches 18.2× fewer nodes for a bit-identical root score, adding a transposition
    table reaches 25.7×, and the effective branching factor falls from 7.04 to 4.10 — about 55% of the way, in log terms, to the Knuth–Moore bound of √b = 2.65. On a 50 ms clock those savings buy roughly two extra plies and 0.656 ± 0.117 per game against bare alpha–beta. We also report three checkers-specific findings that follow from compulsory capture: counting legal moves is an actively harmful mobility proxy, quiescence needs no stand-pat option, and the single-reply extension is free to detect.'
