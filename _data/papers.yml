- file: paper1.pdf
  title: 'Beliefs Beat Trees: Information Set Monte Carlo Tree Search for Exploding Kittens'
  authors:
  - name: Rowan A. Petrosyan
    affiliations:
    - 1
  affiliations:
  - Institute for Interactive Systems, Wrenfield University
  abstract: 'Exploding Kittens is a small, commercially popular card game with hidden hands, a stochastic deck, a cancellation mechanic that makes turns interactive, and an elimination structure that rewards survival rather than accumulation. We present an open, dependency-free implementation of the full 56-card base game with a strict observation filter, and three agents for it: a random baseline, a rule-based heuristic, and an Information Set Monte Carlo Tree Search (ISMCTS) agent. Over 8,700 games we show that the search agent beats the heuristic policy it rolls out (score share 0.575 ± 0.017), and that essentially all of its advantage comes not from the tree but from one modelling choice: a belief distribution over where defused Exploding Kittens were buried. Removing that belief costs 0.097 of score share — more than every other component we ablated combined — and drops the agent below par against the heuristic. Measured directly, the belief cuts the Brier score of the prediction “the
    next card explodes” by 53% on the decisions where it has anything to say, because a buried kitten is on top of the deck 94% of the time and a uniform deck model predicts 22%. We also report a negative result and explain it: against opponents it does not model correctly, the search is worse than the simple heuristic it is built on, and the same belief that is worth 0.097 against modelled opponents is measurably anti-calibrated against unmodelled ones. On this game, at these budgets, the quality of the sampled determinizations dominated every enhancement to the tree.'
