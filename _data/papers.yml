  affiliations:
  - Department of Computer Science, Fjellheim University of Technology, Trondheim, Norway
  - Facultad de Ingeniería, Universidad Austral de Cerro Alto, Valparaíso, Chile
  abstract: 'Battleship is a two-player game of imperfect information in which the opponent is passive: each player independently searches a hidden board, and the winner is whoever needs fewer shots. Its literal state — a 10 × 10 tracking grid with four cell states — has 4¹⁰⁰ configurations, so the game is normally attacked either with hand-written hunt/target heuristics or with deep function approximation. We take the third route: instead of replacing the table with a network, we shrink the problem until a table is the right tool. Each candidate cell is described by what its four orthogonal directions run into first, plus two global features, and the description is canonicalised under the dihedral symmetry of the board. Plain tabular Q-Learning over this action-attached abstraction fills 2,839 entries in 55 seconds of single-core CPU time and clears a board in 52.1 shots, against 56.8 for a tuned hunt/target baseline with a parity sweep and 94.9 for random play; head to head it wins 181
    of 300 games against the heuristic. An ablation over every design decision shows that the binding constraint is not the size of the table but the granularity of the key: deleting a feature that appears informative — the size of the smallest surviving enemy ship — yields a 919-entry table that clears boards in 48.2 shots and beats the heuristic 205–95. Because the policy is a table over local descriptions, it can be read out entry by entry as a list of rules.'
  tags:
  - Q-Learning
  - Imperfect Information
  - Symmetry
  - Ablation
  - Battleship
  hype: While the rest of the field threw billions of parameters at the problem, this paper threw a TABLE at it. And the table WON. 55 seconds of CPU time. Your GPU is now obsolete. Please recycle it responsibly.
